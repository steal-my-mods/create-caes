name: Release

# Tag a release and this uploads it: `git tag v0.1.0 && git push origin v0.1.0`.
#
# Needs one repository secret you create yourself, CURSEFORGE_TOKEN; GITHUB_TOKEN is provided by
# Actions. `curseforge_project_id` must be filled in in gradle.properties.
#
# Run it by hand (workflow_dispatch) and it rehearses by default -- everything except the upload.
# Untick "Rehearse" to publish for real from a branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse without uploading anything'
        type: boolean
        default: true

permissions:
  contents: write # to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, and deliberately before the build: `publishMods` uploads to CurseForge and to GitHub
      # Releases, and a token that is missing or expired fails at *upload*. By then GitHub may have
      # accepted the release already, which leaves a version published on one site and not the other
      # -- and neither site lets you rename or replace a file after upload. A few seconds of curl
      # turns that into a failure before anything has been published anywhere.
      #
      # The endpoint is the CurseForge upload API's cheapest authenticated GET. Measured against the
      # real API rather than assumed: a valid token gets 200, a malformed one 400, an absent one 401.
      # Anything else is reported as CurseForge being unwell rather than as a bad secret, because
      # failing a release over a 502 would be its own kind of wrong.
      - name: Check the CurseForge token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::CURSEFORGE_TOKEN is not set on this repository."
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 30 \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            https://minecraft.curseforge.com/api/game/versions)"
          case "$status" in
            200) echo "CurseForge token accepted." ;;
            400|401|403) echo "::error::CurseForge rejected the token (HTTP $status)."; exit 1 ;;
            *) echo "::error::Could not reach the CurseForge upload API (HTTP $status)."; exit 1 ;;
          esac

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # A tag that disagrees with mod_version would publish the jar under the wrong number on
      # both sites at once, and neither lets you rename a file after upload.
      - name: Check the tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match mod_version=${declared}"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Accept the EULA for the test server
        run: |
          mkdir -p run-gametest
          echo 'eula=true' > run-gametest/eula.txt

      # Never publish something that cannot pass its own tests.
      - name: GameTests
        run: ./gradlew runGameTestServer

      # The art and the Ponder structure are generated; a stale checked-in file would ship in the
      # release jar. Same gate as the build workflow, because a release is the worst place to
      # discover it.
      - name: Generated assets are up to date
        run: |
          python3 tools/generate_textures.py
          python3 tools/generate_ponder.py
          python3 tools/generate_logo.py
          python3 tools/generate_logo.py branding/icon-512.png --size 512
          git add -A
          git diff --cached --exit-code

      - name: Publish to CurseForge and GitHub
        run: ./gradlew publishMods $EXTRA_ARGS
        env:
          # A manual run rehearses unless told otherwise; a tag push always publishes for real.
          EXTRA_ARGS: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '-PdryRun=true' || '' }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
